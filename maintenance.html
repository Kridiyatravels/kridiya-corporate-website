<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#fdf8f0">
  <title>Corporate website under maintenance | Kridiya Travel</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #2f2415;
      background: #fdf8f0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fdf8f0;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 48px);
      text-align: center;
      background: #fff;
      border: 1px solid #e8ded0;
      border-radius: 18px;
      box-shadow: 0 14px 40px rgb(47 36 21 / 0.08);
    }

    img {
      display: block;
      width: 84px;
      height: auto;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .message {
      max-width: 42ch;
      margin: 14px auto 0;
      color: #665b4d;
      font-size: 1rem;
      line-height: 1.6;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #ece4d9;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .contact a {
      color: #2f2415;
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .contact a:hover { color: #2f2415; }

    .contact a:focus-visible {
      outline: 2px solid #2f2415;
      outline-offset: 4px;
      border-radius: 2px;
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      main { padding: 28px 20px; border-radius: 14px; }
      img { width: 72px; margin-bottom: 20px; }
      h1 { font-size: 1.65rem; }
      .message { font-size: 0.95rem; }
      .contact {
        flex-direction: column;
        gap: 10px;
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo.png" alt="Kridiya Travel and Tourism">
    <h1>Website under maintenance</h1>
    <p class="message">We are updating our corporate website. For business travel enquiries, please contact us directly.</p>
    <div class="contact" aria-label="Contact Kridiya Travel">
      <a href="tel:+971509413873">+971 50 941 3873</a>
      <a href="mailto:contact@kridiyatravel.com">contact@kridiyatravel.com</a>
    </div>
  </main>
</body>
</html>
